name: Veille alternance

on:
  schedule:
    - cron: "23 5 * * *"   # tous les jours vers 6 h 23 (heure de Paris en hiver)
  workflow_dispatch:        # lancement manuel depuis l'onglet Actions

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover tests

      - name: Recherche des offres
        env:
          LBA_API_KEY: ${{ secrets.LBA_API_KEY }}
        run: python -m agent

      - name: Enregistrement du rapport
        run: |
          git config user.name "veille-alternance[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Veille alternance du $(date +%F)"
            git push
          fi
