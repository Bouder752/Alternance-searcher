# Profil de recherche d'alternance : modifie ce fichier pour ajuster l'agent.
# Aucune donnée personnelle (téléphone, e-mail…) ne doit figurer ici.

profil:
  resume: >
    Master « European Digital and Sustainable Business » (EM Strasbourg / FHNW Basel /
    HSO Offenburg), M2 en alternance de 12 mois à partir de septembre 2027.
    Trilingue français / allemand C2 / anglais C1. Supply chain, gestion de projet,
    RSE, environnement international.
  debut_souhaite: "2027-09-01"
  niveau_diplome: 7          # 7 = Bac+5 (nomenclature européenne)

localisation:
  ville: Strasbourg
  latitude: 48.5734
  longitude: 7.7521
  rayon_km: 50

# Groupes de mots-clés : un groupe rapporte ses points une seule fois
# (x2 si le mot-clé apparaît dans l'intitulé du poste).
mots_cles:
  - groupe: Supply chain & planification
    poids: 20
    termes: [supply chain, planification, planificateur, planificatrice, planning, planner,
             demand planner, demand planning, supply planner, s&op, sop, approvisionnement,
             approvisionneur, ordonnancement, ordonnanceur, gestion des flux, logistique,
             logistics, prévisions, forecast, plan de production, stocks, distribution excellence,
             export operations, customer service, adv]
  - groupe: Chargé de mission / gestion de projet
    poids: 15
    termes: [chargé de mission, chargée de mission, chargé(e) de mission, chef de projet,
             cheffe de projet, gestion de projet, project manager, project management, pmo,
             coordinateur, coordinatrice, business analyst, amélioration continue,
             chargé de projet, chargée de projet, assistant chef de projet]
  - groupe: RSE & développement durable
    poids: 10
    termes: [rse, csr, développement durable, sustainability, sustainable, durabilité,
             décarbonation, bilan carbone, carbone, économie circulaire, environnemental,
             environnementale, management environnemental, transition écologique, eco-conception, éco-conception, esg,
             achats responsables, impact environnemental, iso 14001]
  - groupe: International
    poids: 8
