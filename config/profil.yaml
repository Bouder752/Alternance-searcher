             deutsch, franco-allemand, allemagne, suisse, trinational, européen, européenne,
             anglais courant, bilingue, trilingue, emea, business international]
  - groupe: Débouchés du master EDSB
    # Liste « Job prospects » de la fiche officielle du master EDSB (EM Strasbourg)
    poids: 6
    termes: [bid manager, appel d'offres, appels d'offres, business manager,
             chef de projet industriel, contrats industriels, éco-conception, export manager,
             responsable export, transition technologique, transformation digitale,
             marketing durable, achats, acheteur, acheteuse, procurement, sourcing]
  - groupe: Compétences
    poids: 3
    termes: [kpi, reporting, power bi, excel, tableau de bord, tableaux de bord, analyse de données,
             data, lean, sap, erp, crm]

